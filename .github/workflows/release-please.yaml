---
# Maintains a standing "release: X.Y.Z" PR listing everything unreleased.
# Merging it is the release decision — nothing here merges on your behalf.
#
# The app token matters: a tag pushed with the default GITHUB_TOKEN does not
# trigger other workflows, so release.yaml (on: push: tags) would never fire.
# A GitHub App token does trigger it, which keeps release.yaml unchanged and
# still reachable by a hand-pushed tag.
name: Release Please

on:
  push:
    branches: ["main"]
  # Manual trigger for release-notes recovery (issue #507). A dropped
  # entry returns when the next run rebuilds the notes after the merged
  # pull-request body gets its override block, and the guard stays red
  # until some push to main starts that rebuild. This trigger forces the
  # rebuild without an unrelated commit. A dispatch run behaves like a
  # push run: same steps, same job permissions, and it only updates the
  # standing release PR unless that PR is merged separately. See
  # docs/release-notes-omissions.md for the recovery procedure.
  workflow_dispatch:

# Serialize runs across triggers. Each run rebuilds and force-pushes the
# notes branch, so a dispatch started during a push run queues behind it
# instead of racing it (#507). Runs are never cancelled mid-flight, only
# replaced in the queue by a newer one.
concurrency:
  group: release-please
  cancel-in-progress: false

permissions: {}

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Generate bot token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ secrets.MISO_APP_ID }}
          private-key: ${{ secrets.MISO_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
