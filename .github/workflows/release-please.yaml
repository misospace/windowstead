---
# Maintains a standing "release: X.Y.Z" PR listing everything unreleased.
# Merging it is the release decision — nothing here merges on your behalf.
#
# The app token matters: a tag pushed with the default GITHUB_TOKEN does not
# trigger other workflows, so release.yaml (on: push: tags) would never fire.
# A GitHub App token does trigger it, which keeps release.yaml unchanged and
# still reachable by a hand-pushed tag.
name: Release Please

on:
  push:
    branches: ["main"]

permissions: {}

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Generate bot token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.MISO_APP_ID }}
          private-key: ${{ secrets.MISO_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
