---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
#
# Guards the open release notes against silent commit drops (#501).
# release-please can lose a commit whose message body breaks the
# conventional-commit parser (issue #497 lost d47adc5). This workflow
# compares the visible-type commits since the last release tag against
# CHANGELOG.md on the open release branch and fails with the missing
# SHAs. It is a normal check, not a release gate: operators can merge a
# release with a red guard and a note.
name: Release Notes Guard

on:
  schedule:
    # Hourly backstop: catches a dropped entry even when Release Please
    # never ran, and re-checks without depending on workflow ordering.
    - cron: "0 * * * *"
  push:
    branches: ["main"]
  workflow_dispatch:

permissions: {}

# A burst of pushes to main would otherwise stack delayed guard runs;
# only the newest state per trigger matters. Grouping per event keeps an
# hourly schedule from cancelling a push run mid-delay, which would
# strip that run of its Release Please wait.
concurrency:
  group: release-notes-guard-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  release-notes-guard:
    name: Release Notes Guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Skip-changelog exclusion reasons come from the issue-labels
      # endpoint, which needs the issues category, not pull-requests.
      pull-requests: read
      issues: read
    steps:
      # Release Please updates the notes branch after a push to main.
      # Wait it out before fetching anything, so the checkout snapshots
      # the notes Release Please just wrote, not the stale ones; a
      # scheduled run already avoids the race.
      - name: Wait for Release Please
        if: github.event_name == 'push'
        run: sleep 300

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history plus tags for `git describe`, and all branches so
          # the open release branch is available locally.
          fetch-depth: 0

      - name: Check release notes cover every visible commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 .github/scripts/verify-release-notes.py --repo .
