name: Manual Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (for example 0.0.20 or v0.0.20 — a leading "v" is stripped)'
        required: true
        type: string

concurrency:
  group: manual-release
  cancel-in-progress: false

jobs:
  publish-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate bot token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Checkout protected main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Read release metadata
        id: release
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Shared single source of truth for the release tag pattern (same
      # check as release.yml's workflow_dispatch entry point). The validator
      # also strips a single leading 'v' from the operator input and exposes
      # the canonical tag, so 'v0.0.20' and '0.0.20' both release 0.0.20.
      - name: Validate release tag
        id: validate
        uses: ./.github/actions/validate-release-tag
        with:
          tag: ${{ inputs.version }}

      - name: Create tag at protected main
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SHA: ${{ steps.release.outputs.sha }}
          TAG: ${{ steps.validate.outputs.tag }}
        run: |
          set -euo pipefail
          if EXISTING_SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq .object.sha 2>/dev/null); then
            if [ "$EXISTING_SHA" != "$SHA" ]; then
              echo "Tag $TAG already points to $EXISTING_SHA"
              exit 1
            fi
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$SHA" >/dev/null
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ steps.validate.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes
          fi
